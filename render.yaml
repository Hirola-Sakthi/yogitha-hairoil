services:
  - type: web
    name: yogitha-hairoil
    runtime: node
    buildCommand: npm ci && npm --prefix server ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ambar_commerce
